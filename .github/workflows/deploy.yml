name: Test e pubblicazione

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      apply_schema:
        description: Applica supabase/schema.sql al database (serve il segreto SUPABASE_ACCESS_TOKEN)
        type: boolean
        default: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ixhnqeabctkpflwkdarj

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test del sito e della funzione
        run: npm test
      - name: Test del database
        run: npm run test:db
      - name: Test con il browser (Chrome del runner, anteprima con dati finti)
        run: npx playwright test

  pages:
    name: Pubblica su GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepara solo i file del sito
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  claude-function:
    name: Pubblica la funzione di Claude
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: supabase
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Controlla se serve pubblicare
        id: changes
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Segreto SUPABASE_ACCESS_TOKEN non impostato: la funzione non viene pubblicata da GitHub."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null || ! git diff --quiet "$BEFORE_SHA" HEAD -- supabase/functions; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.deploy == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.109.1
      - if: steps.changes.outputs.deploy == 'true'
        run: supabase functions deploy claude --project-ref "$SUPABASE_PROJECT_REF" --use-api

  schema:
    name: Applica lo schema del database
    if: github.event_name == 'workflow_dispatch' && inputs.apply_schema
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: supabase
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.109.1
      - name: Applica lo schema e controlla la sicurezza
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db query --linked -f supabase/schema.sql
          supabase db advisors --linked --type security --level warn
